<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f6f8">
<title>文本转换器</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --text:#15181e; --muted:#6b7280;
    --line:#e6e8ec; --accent:#2f6fed; --accent-ink:#fff; --soft:#eef3fe;
    --ok:#0f8b63; --err:#cf3b3b;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0e1014; --card:#171a21; --text:#e9ecf1; --muted:#98a0ad;
      --line:#272c36; --accent:#6a9bff; --accent-ink:#0a1224; --soft:#16213a;
      --ok:#3ccf9b; --err:#ff7070;
    }
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; padding:20px 16px 40px; background:var(--bg); color:var(--text);
    font:15.5px/1.55 -apple-system,BlinkMacSystemFont,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  }
  .wrap{max-width:640px; margin:0 auto}
  header{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:14px}
  h1{font-size:20px; line-height:1.3; margin:0 0 3px; letter-spacing:-.01em}
  .sub{margin:0; font-size:12.5px; color:var(--muted)}
  .hint-btn{
    flex:none; font:inherit; font-size:12.5px; color:var(--muted); background:var(--card);
    border:1px solid var(--line); border-radius:999px; padding:5px 11px; cursor:pointer;
    transition:.15s; white-space:nowrap;
  }
  .hint-btn:hover{color:var(--text); border-color:var(--muted)}
  .hint-btn[aria-expanded="true"]{background:var(--soft); border-color:transparent; color:var(--accent)}
  .hint-panel{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:13px 15px; margin-bottom:14px; font-size:13px; color:var(--muted);
  }
  .hint-panel p{margin:0 0 9px}
  .hint-panel p:last-child{margin:0}
  .hint-panel b{color:var(--text); font-weight:600}

  .tabs{display:flex; gap:6px; margin-bottom:14px; background:var(--card); padding:4px; border:1px solid var(--line); border-radius:12px}
  .tab{
    flex:1; font:inherit; font-size:14px; font-weight:500; color:var(--muted); background:none; border:0;
    border-radius:9px; padding:9px 8px; cursor:pointer; transition:.15s;
  }
  .tab.on{background:var(--accent); color:var(--accent-ink)}

  .inputbox{position:relative; margin-bottom:10px}
  textarea{
    width:100%; min-height:150px; resize:vertical; padding:12px 13px;
    font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--text);
    background:var(--card); border:1px solid var(--line); border-radius:12px;
  }
  textarea:focus{outline:2px solid var(--accent); outline-offset:1px}
  .filetip{
    display:flex; align-items:center; gap:10px; padding:14px 15px; background:var(--soft);
    border:1px solid transparent; border-radius:12px; font-size:13.5px;
  }
  .filetip .nm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:550}
  .filebar{display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap}
  .filebtn{
    font:inherit; font-size:13px; color:var(--accent); background:var(--card);
    border:1px solid var(--line); border-radius:9px; padding:7px 12px; cursor:pointer;
  }
  .filebtn:hover{border-color:var(--accent)}
  .ghost{font:inherit; font-size:12.5px; color:var(--muted); background:none; border:0; padding:4px; cursor:pointer; text-decoration:underline; text-underline-offset:3px}
  .ghost:hover{color:var(--text)}
  .muted{font-size:12px; color:var(--muted); margin-left:auto}

  .opts{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:12px}
  .field{display:flex; flex-direction:column; gap:5px; font-size:12px; color:var(--muted)}
  select,input.num{
    font:inherit; font-size:13.5px; color:var(--text); background:var(--card);
    border:1px solid var(--line); border-radius:9px; padding:8px 9px; width:100%;
  }
  .checks{display:grid; gap:8px; margin-bottom:14px}
  .checks label{display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--text); cursor:pointer}
  .checks input{width:16px; height:16px; accent-color:var(--accent); flex:none}
  .checks .note{margin-left:26px; font-size:11.5px; color:var(--muted)}

  .est{margin:0 0 14px; font-size:12.5px; color:var(--muted)}
  .primary{
    width:100%; font:inherit; font-size:14.5px; font-weight:600; color:var(--accent-ink);
    background:var(--accent); border:0; border-radius:10px; padding:12px; cursor:pointer;
  }
  .primary:disabled{opacity:.55; cursor:default}
  select:focus-visible,button:focus-visible,textarea:focus-visible,.filebtn:focus-within{outline:2px solid var(--accent); outline-offset:2px}

  .parts{display:grid; gap:6px; margin-top:14px; max-height:280px; overflow:auto}
  .part{
    display:flex; align-items:center; gap:10px; padding:8px 10px;
    background:var(--card); border:1px solid var(--line); border-radius:9px; font-size:13px;
  }
  .part .pn{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .part .ps{flex:none; font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums}
  .part button{
    flex:none; font:inherit; font-size:12px; color:var(--accent); background:none;
    border:1px solid var(--line); border-radius:7px; padding:3px 9px; cursor:pointer;
  }
  .part button:hover{border-color:var(--accent)}

  .status{margin:14px 0 0; font-size:12.5px; color:var(--muted); word-break:break-word}
  .status.ok{color:var(--ok)}
  .status.err{color:var(--err)}
  .status a{color:inherit}

  footer{margin-top:18px; text-align:center; font-size:11.5px; color:var(--muted)}
  .note{margin:0 0 8px}
  .dev-link{
    font:inherit; font-size:11.5px; color:var(--muted); background:none; border:0; padding:6px 8px;
    cursor:pointer; text-decoration:underline; text-underline-offset:3px; opacity:.8;
  }
  .dev-link:hover{opacity:1; color:var(--text)}
  .dev-panel{
    margin:10px auto 0; padding:16px 14px; max-width:320px;
    background:var(--card); border:1px solid var(--line); border-radius:14px;
  }
  .dev-author{margin:0 0 12px; font-size:13.5px; color:var(--text)}
  .dev-author b{font-weight:600}
  .dev-qr{display:block; width:100%; max-width:280px; height:auto; margin:0 auto 10px; border-radius:10px}
  .dev-tip{margin:0; font-size:11.5px; color:var(--muted)}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div>
      <h1>文本转换器</h1>
      <p class="sub">纯文本转换 · 不保留字体/图片/表格 · 不上传</p>
    </div>
    <button id="hintBtn" class="hint-btn" type="button" aria-expanded="false" aria-controls="hintPanel">说明 ?</button>
  </header>

  <div id="hintPanel" class="hint-panel" hidden></div>

  <nav class="tabs" role="tablist">
    <button id="tabConvert" class="tab on" data-pane="convert" type="button" role="tab" aria-selected="true">格式转换</button>
    <button id="tabSplit" class="tab" data-pane="split" type="button" role="tab" aria-selected="false">文本分割</button>
  </nav>

  <section id="pane-convert" class="pane">
    <div class="inputbox">
      <textarea id="cText" placeholder="粘贴文本；或把 .txt / .md / .csv / .docx 拖进这里"></textarea>
      <div id="cFileTip" class="filetip" hidden>
        <span class="nm" id="cFileName"></span>
        <span class="muted" id="cFileSize"></span>
        <button id="cFileRemove" class="ghost" type="button">移除</button>
      </div>
    </div>
    <div class="filebar">
      <label class="filebtn">选择文件<input id="cFile" type="file" accept=".txt,.md,.markdown,.csv,.docx,text/plain" hidden></label>
      <button id="cClear" class="ghost" type="button">清空</button>
      <span class="muted" id="cCount"></span>
    </div>

    <div class="opts">
      <label class="field"><span>目标格式</span>
        <select id="cTarget">
          <option value="docx">Word 文档 .docx</option>
          <option value="epub">电子书 .epub</option>
          <option value="html">网页 .html</option>
          <option value="md">Markdown .md</option>
          <option value="rtf">富文本 .rtf</option>
          <option value="txt">纯文本 .txt</option>
          <option value="json">JSON .json</option>
          <option value="csv">Excel 可读 .csv</option>
        </select>
      </label>
    </div>

    <div id="cDocxOpts" class="checks">
      <label><input type="checkbox" id="optLine" checked> 每个换行单独成段</label>
      <label><input type="checkbox" id="optSoft"> 段落内保留换行（软回车）</label>
      <span class="note">这两个互斥：勾一个会取消另一个</span>
      <label><input type="checkbox" id="optTrim"> 去掉每行首尾空白</label>
      <label><input type="checkbox" id="optMerge" checked> 合并连续空行</label>
    </div>

    <div id="cTxtOpts" class="checks" hidden>
      <label><input type="checkbox" id="optBlank"> 段落之间留一个空行</label>
    </div>

    <p class="est" id="cEst">—</p>
    <button id="cGo" class="primary" type="button">转换并下载</button>
  </section>

  <section id="pane-split" class="pane" hidden>
    <div class="inputbox">
      <textarea id="sText" placeholder="粘贴要分割的文本；或把 .txt / .md / .csv 拖进这里"></textarea>
    </div>
    <div class="filebar">
      <label class="filebtn">选择文件<input id="sFile" type="file" accept=".txt,.md,.markdown,.csv,text/plain" hidden></label>
      <button id="sClear" class="ghost" type="button">清空</button>
      <span class="muted" id="sCount"></span>
    </div>

    <div class="opts">
      <label class="field"><span>切法</span>
        <select id="sMode">
          <option value="parts">切成 N 份</option>
          <option value="lines">每份 X 行</option>
          <option value="chars">每份 X 字</option>
          <option value="sep">按分隔符切</option>
        </select>
      </label>
      <label class="field"><span id="sParamLabel">份数</span>
        <input id="sParam" class="num" type="text" inputmode="numeric" value="3">
      </label>
    </div>

    <p class="est" id="sEst">—</p>
    <button id="sZip" class="primary" type="button">打包 ZIP 下载</button>
    <div id="sList" class="parts"></div>
  </section>

  <p class="status" id="status" role="status" aria-live="polite" hidden></p>

  <footer>
    <p class="note">文本只在本机处理，不会上传到任何服务器</p>
    <button id="devBtn" class="dev-link" type="button" aria-expanded="false" aria-controls="devPanel">开发者选项</button>
    <div id="devPanel" class="dev-panel" hidden>
      <p class="dev-author">作者：<b>白洛bailuo</b></p>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };

  /* ================= 工具 ================= */

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function fmtSize(n) {
    if (!isFinite(n)) return '—';
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(n < 10240 ? 1 : 0) + ' KB';
    return (n / 1048576).toFixed(1) + ' MB';
  }

  function setStatus(html, cls) {
    var el = $('status');
    el.innerHTML = html || '';
    el.className = 'status' + (cls ? ' ' + cls : '');
    el.hidden = !html;
  }

  function download(blob, name) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
    return url;
  }

  /* ================= 提示面板 ================= */

  $('hintBtn').addEventListener('click', function (e) {
    e.stopPropagation();
    var p = $('hintPanel');
    if (p.hidden) {
      p.innerHTML =
        '<p><b>这是纯文本转换器</b>：只搬运文字本身，<b>不保留</b>字体、颜色、字号、图片、表格线等格式。</p>' +
        '<p><b>能导入</b>：.txt / .md / .csv（自动识别 UTF-8 与 GBK 编码）、.docx（提取正文文字）。</p>' +
        '<p><b>能导出</b>：.docx / .epub / .html / .md / .rtf / .txt / .json / .csv —— 全部由浏览器本地生成。</p>' +
        '<p><b>文本分割</b>：按份数 / 行数 / 字数 / 分隔符切开，可逐份下载或打包 ZIP。</p>' +
        '<p>老的 .doc 格式（1997 年那种二进制格式）和 PDF 无法读取，浏览器里做不了。</p>';
    }
    p.hidden = !p.hidden;
    $('hintBtn').setAttribute('aria-expanded', String(!p.hidden));
  });

  document.addEventListener('click', function (e) {
    var p = $('hintPanel');
    if (!p.hidden && !p.contains(e.target) && e.target !== $('hintBtn')) {
      p.hidden = true;
      $('hintBtn').setAttribute('aria-expanded', 'false');
    }
  });

  /* ================= 标签切换 ================= */

  function setPane(name) {
    $('pane-convert').hidden = name !== 'convert';
    $('pane-split').hidden = name !== 'split';
    $('tabConvert').classList.toggle('on', name === 'convert');
    $('tabSplit').classList.toggle('on', name === 'split');
    $('tabConvert').setAttribute('aria-selected', String(name === 'convert'));
    $('tabSplit').setAttribute('aria-selected', String(name === 'split'));
    setStatus('');
  }
  $('tabConvert').addEventListener('click', function () { setPane('convert'); });
  $('tabSplit').addEventListener('click', function () { setPane('split'); });

  /* ================= CRC32 + ZIP 写入（store 模式，不压缩） ================= */

  var CRC_TABLE = (function () {
    var t = new Uint32Array(256);
    for (var n = 0; n < 256; n++) {
      var c = n;
      for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();

  function crc32(bytes) {
    var c = 0xFFFFFFFF;
    for (var i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  function dosDateTime(d) {
    var time = ((d.getHours() & 31) << 11) | ((d.getMinutes() & 63) << 5) | ((d.getSeconds() / 2) & 31);
    var date = (((d.getFullYear() - 1980) & 127) << 9) | (((d.getMonth() + 1) & 15) << 5) | (d.getDate() & 31);
    return { time: time, date: date };
  }

  function zipStore(files) {
    var enc = new TextEncoder();
    var dt = dosDateTime(new Date());
    var local = [], central = [], offset = 0;

    files.forEach(function (f) {
      var name = enc.encode(f.name);
      var data = f.bytes;
      var crc = crc32(data);

      var lh = new Uint8Array(30 + name.length);
      var lv = new DataView(lh.buffer);
      lv.setUint32(0, 0x04034b50, true);
      lv.setUint16(4, 20, true);
      lv.setUint16(6, 0x0800, true);
      lv.setUint16(8, 0, true);
      lv.setUint16(10, dt.time, true);
      lv.setUint16(12, dt.date, true);
      lv.setUint32(14, crc, true);
      lv.setUint32(18, data.length, true);
      lv.setUint32(22, data.length, true);
      lv.setUint16(26, name.length, true);
      lv.setUint16(28, 0, true);
      lh.set(name, 30);
      local.push(lh, data);

      var ch = new Uint8Array(46 + name.length);
      var cv = new DataView(ch.buffer);
      cv.setUint32(0, 0x02014b50, true);
      cv.setUint16(4, 20, true);
      cv.setUint16(6, 20, true);
      cv.setUint16(8, 0x0800, true);
      cv.setUint16(10, 0, true);
      cv.setUint16(12, dt.time, true);
      cv.setUint16(14, dt.date, true);
      cv.setUint32(16, crc, true);
      cv.setUint32(20, data.length, true);
      cv.setUint32(24, data.length, true);
      cv.setUint16(28, name.length, true);
      cv.setUint16(30, 0, true);
      cv.setUint16(32, 0, true);
      cv.setUint16(34, 0, true);
      cv.setUint16(36, 0, true);
      cv.setUint32(38, 0, true);
      cv.setUint32(42, offset, true);
      ch.set(name, 46);
      central.push(ch);

      offset += lh.length + data.length;
    });

    var cdSize = central.reduce(function (a, b) { return a + b.length; }, 0);
    var eocd = new Uint8Array(22);
    var ev = new DataView(eocd.buffer);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(8, files.length, true);
    ev.setUint16(10, files.length, true);
    ev.setUint32(12, cdSize, true);
    ev.setUint32(16, offset, true);

    return new Blob(local.concat(central, [eocd]), { type: 'application/zip' });
  }

  /* ================= ZIP 读取 ================= */

  function unzipIndex(arrayBuffer) {
    var u8 = new Uint8Array(arrayBuffer), dv = new DataView(arrayBuffer);
    var eocd = -1;
    for (var i = u8.length - 22; i >= 0 && i > u8.length - 66000; i--) {
      if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error('不是有效的 ZIP 包');

    var count = dv.getUint16(eocd + 10, true);
    var p = dv.getUint32(eocd + 16, true);
    var entries = {};

    for (var n = 0; n < count; n++) {
      if (dv.getUint32(p, true) !== 0x02014b50) throw new Error('ZIP 目录损坏');
      var method = dv.getUint16(p + 10, true);
      var csize = dv.getUint32(p + 20, true);
      var nameLen = dv.getUint16(p + 28, true);
      var extraLen = dv.getUint16(p + 30, true);
      var commentLen = dv.getUint16(p + 32, true);
      var lho = dv.getUint32(p + 42, true);
      var name = new TextDecoder('utf-8').decode(u8.subarray(p + 46, p + 46 + nameLen));

      var lNameLen = dv.getUint16(lho + 26, true);
      var lExtraLen = dv.getUint16(lho + 28, true);
      var start = lho + 30 + lNameLen + lExtraLen;

      entries[name] = { method: method, raw: u8.subarray(start, start + csize) };
      p += 46 + nameLen + extraLen + commentLen;
    }
    return entries;
  }

  function inflateRaw(value) {
    if (typeof DecompressionStream !== 'function') {
      return Promise.reject(new Error('浏览器不支持 DecompressionStream，无法解压 .docx'));
    }
    var ds = new DecompressionStream('deflate-raw');
    var src = value instanceof Blob ? value : new Blob([value]);
    return new Response(src.stream().pipeThrough(ds)).arrayBuffer();
  }

  function readEntry(entry) {
    if (entry.method === 0) return Promise.resolve(entry.raw);
    if (entry.method === 8) return inflateRaw(entry.raw).then(function (ab) { return new Uint8Array(ab); });
    return Promise.reject(new Error('不支持的压缩方式（' + entry.method + '）'));
  }

  /* ================= docx → 纯文本 ================= */

  var RE_BR = /<w:br\b[^>]*\/?>/g;
  var RE_TAB = /<w:tab\b[^>]*\/?>/g;
  var RE_CELL_END = /<\/w:tc>/g;
  var RE_ROW_END = /<\/w:tr>/g;
  var RE_PARA_END = /<\/w:p>/g;
  var RE_PARA_EMPTY = /<w:p\b[^>]*\/>/g;
  var RE_TAGS = /<[^>]+>/g;

  function decodeEntities(s) {
    return s.replace(/&#x([0-9a-fA-F]+);/g, function (_, h) { return String.fromCodePoint(parseInt(h, 16)); })
      .replace(/&#(\d+);/g, function (_, d) { return String.fromCodePoint(parseInt(d, 10)); })
      .replace(/&lt;/g, '<').replace(/&gt;/g, '>')
      .replace(/&quot;/g, '"').replace(/&apos;/g, "'")
      .replace(/&amp;/g, '&');
  }

  function extractDocxText(xml) {
    var body = xml.match(/<w:body[^>]*>([\s\S]*)<\/w:body>/i);
    var s = (body ? body[1] : xml.replace(/<\?xml[^>]*\?>/g, ''))
      .replace(RE_BR, '\n')
      .replace(RE_TAB, '\t')
      .replace(RE_CELL_END, '\t')
      .replace(RE_ROW_END, '\n')
      .replace(RE_PARA_END, '\n')
      .replace(RE_PARA_EMPTY, '\n')
      .replace(RE_TAGS, '');
    s = decodeEntities(s);
    return s.replace(/\r\n?/g, '\n')
      .replace(/\n\t/g, '\t')
      .replace(/[ \t]+$/gm, '')
      .replace(/\n{3,}/g, '\n\n');
  }

  function docxToText(arrayBuffer) {
    var entries;
    try { entries = unzipIndex(arrayBuffer); }
    catch (e) { return Promise.reject(e); }

    var doc = entries['word/document.xml'];
    if (!doc) return Promise.reject(new Error('这不是有效的 .docx（缺少 word/document.xml）'));

    return readEntry(doc).then(function (bytes) {
      return extractDocxText(new TextDecoder('utf-8').decode(bytes));
    });
  }

  /* ================= 纯文本 → docx ================= */

  function xmlEsc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function paraXml(text) {
    if (text === '') return '<w:p/>';
    var parts = text.split('\n');
    var runs = '';
    for (var i = 0; i < parts.length; i++) {
      if (i > 0) runs += '<w:br/>';
      if (parts[i] !== '') runs += '<w:t xml:space="preserve">' + xmlEsc(parts[i]) + '</w:t>';
    }
    return '<w:p><w:r>' + runs + '</w:r></w:p>';
  }

  function textToParagraphs(text, opt) {
    var t = text.replace(/\r\n?/g, '\n');
    var lines = t.split('\n');
    if (opt.trim) lines = lines.map(function (l) { return l.trim(); });

    var paras = [];
    if (opt.soft) {
      var buf = [];
      lines.forEach(function (l) {
        if (l === '') { if (buf.length) { paras.push(buf.join('\n')); buf = []; } }
        else buf.push(l);
      });
      if (buf.length) paras.push(buf.join('\n'));
      return paras;
    }

    var emptyRun = 0;
    lines.forEach(function (l) {
      if (l === '') {
        emptyRun++;
        if (!opt.merge || emptyRun === 1) paras.push('');
      } else {
        emptyRun = 0;
        paras.push(l);
      }
    });
    if (opt.merge) while (paras.length && paras[paras.length - 1] === '') paras.pop();
    return paras;
  }

  function buildDocx(text, opt) {
    var enc = new TextEncoder();
    var paras = textToParagraphs(text, opt);
    var body = paras.map(paraXml).join('');

    var now = new Date().toISOString().replace(/\.\d+Z$/, 'Z');

    var documentXml =
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
      '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">' +
      '<w:body>' + body +
      '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/>' +
      '<w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="851" w:footer="992" w:gutter="0"/>' +
      '</w:sectPr></w:body></w:document>';

    var contentTypes =
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>' +
      '<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/>' +
      '<Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/>' +
      '</Types>';

    var rels =
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>' +
      '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/>' +
      '<Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/extended-properties" Target="docProps/app.xml"/>' +
      '</Relationships>';

    var docRels =
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"></Relationships>';

    var core =
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
      '<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" ' +
      'xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" ' +
      'xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">' +
      '<dc:creator>白洛bailuo</dc:creator>' +
      '<cp:lastModifiedBy>白洛bailuo</cp:lastModifiedBy>' +
      '<dcterms:created xsi:type="dcterms:W3CDTF">' + now + '</dcterms:created>' +
      '<dcterms:modified xsi:type="dcterms:W3CDTF">' + now + '</dcterms:modified>' +
      '</cp:coreProperties>';

    var app =
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
      '<Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties">' +
      '<Application>文本转换器</Application></Properties>';

    return zipStore([
      { name: '[Content_Types].xml', bytes: enc.encode(contentTypes) },
      { name: '_rels/.rels', bytes: enc.encode(rels) },
      { name: 'word/document.xml', bytes: enc.encode(documentXml) },
      { name: 'word/_rels/document.xml.rels', bytes: enc.encode(docRels) },
      { name: 'docProps/core.xml', bytes: enc.encode(core) },
      { name: 'docProps/app.xml', bytes: enc.encode(app) }
    ]);
  }

  /* ================= 文件读取 ================= */

  function readTextFile(file) {
    return file.arrayBuffer().then(function (buf) {
      try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); }
      catch (e) {
        try { return new TextDecoder('gbk').decode(buf); }
        catch (e2) { return new TextDecoder('utf-8').decode(buf); }
      }
    });
  }

  function isDocx(file) {
    return /\.docx$/i.test(file.name) ||
      /wordprocessingml/.test(file.type || '');
  }

  /* ================= 其它导出格式 ================= */

  var PARA_FORMATS = { docx: 1, epub: 1, html: 1, md: 1 };
  var EXT = { docx: 'docx', epub: 'epub', html: 'html', md: 'md', rtf: 'rtf', txt: 'txt', json: 'json', csv: 'csv' };

  function htmlEscape(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function parasToHtml(paras) {
    return paras.map(function (p) {
      if (p === '') return '<p class="blank"></p>';
      return '<p>' + p.split('\n').map(htmlEscape).join('<br/>') + '</p>';
    }).join('\n');
  }

  function buildHtml(title, paras) {
    return '<!doctype html>\n<html lang="zh-CN">\n<head>\n<meta charset="utf-8">\n' +
      '<meta name="viewport" content="width=device-width,initial-scale=1">\n' +
      '<title>' + htmlEscape(title) + '</title>\n' +
      '<style>body{max-width:42em;margin:2em auto;padding:0 1.2em;font:16px/1.85 -apple-system,"Noto Sans SC","PingFang SC",sans-serif;color:#222}' +
      'p{margin:0 0 .9em}p.blank{height:.9em}</style>\n</head>\n<body>\n' +
      parasToHtml(paras) + '\n</body>\n</html>\n';
  }

  function rtfEscape(s) {
    var out = '';
    for (var i = 0; i < s.length; i++) {
      var c = s.charCodeAt(i);
      if (c === 10) { out += '\\line '; continue; }
      if (c === 9) { out += '\\tab '; continue; }
      if (c === 92 || c === 123 || c === 125) { out += '\\' + String.fromCharCode(c); continue; }
      if (c < 32) continue;
      if (c < 128) { out += String.fromCharCode(c); continue; }
      out += '\\u' + (c > 32767 ? c - 65536 : c) + '?';
    }
    return out;
  }

  function buildRtf(paras) {
    var body = paras.map(function (p) { return '\\pard\\sa120 ' + rtfEscape(p) + '\\par\n'; }).join('');
    return '{\\rtf1\\ansi\\ansicpg936\\deff0{\\fonttbl{\\f0\\fnil\\fcharset134 SimSun;}}' +
      '\\uc1\\f0\\fs24\n' + body + '}';
  }

  function buildJson(paras, text, title) {
    return JSON.stringify({ title: title, paragraphs: paras, text: text }, null, 2);
  }

  function csvCell(s) {
    return '"' + s.replace(/"/g, '""') + '"';
  }

  function buildCsv(text) {
    var lines = text.replace(/\r\n?/g, '\n').split('\n');
    var rows = ['序号,内容'];
    lines.forEach(function (l, i) { rows.push((i + 1) + ',' + csvCell(l)); });
    return rows.join('\r\n') + '\r\n';
  }

  function uuid() {
    if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
    var s = '';
    for (var i = 0; i < 32; i++) s += Math.floor(Math.random() * 16).toString(16);
    return s.slice(0, 8) + '-' + s.slice(8, 12) + '-4' + s.slice(13, 16) + '-a' + s.slice(17, 20) + '-' + s.slice(20, 32);
  }

  function buildEpub(title, paras) {
    var enc = new TextEncoder();
    var id = 'urn:uuid:' + uuid();
    var esc2 = htmlEscape;
    var body = paras.map(function (p) {
      if (p === '') return '<p class="blank">&#160;</p>';
      return '<p>' + p.split('\n').map(esc2).join('<br/>') + '</p>';
    }).join('\n');

    var xhtml = '<?xml version="1.0" encoding="utf-8"?>\n' +
      '<!DOCTYPE html>\n' +
      '<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="zh-CN" lang="zh-CN">\n' +
      '<head>\n<meta charset="utf-8"/>\n<title>' + esc2(title) + '</title>\n' +
      '<link rel="stylesheet" type="text/css" href="style.css"/>\n</head>\n' +
      '<body>\n<h1>' + esc2(title) + '</h1>\n' + body + '\n</body>\n</html>\n';

    var opf = '<?xml version="1.0" encoding="utf-8"?>\n' +
      '<package xmlns="http://www.idpf.org/2007/opf" version="2.0" unique-identifier="BookId">\n' +
      '<metadata xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:opf="http://www.idpf.org/2007/opf">\n' +
      '<dc:title>' + esc2(title) + '</dc:title>\n' +
      '<dc:creator>白洛bailuo</dc:creator>\n' +
      '<dc:language>zh-CN</dc:language>\n' +
      '<dc:identifier id="BookId">' + id + '</dc:identifier>\n' +
      '</metadata>\n<manifest>\n' +
      '<item id="ncx" href="toc.ncx" media-type="application/x-dtbncx+xml"/>\n' +
      '<item id="css" href="style.css" media-type="text/css"/>\n' +
      '<item id="body" href="text.xhtml" media-type="application/xhtml+xml"/>\n' +
      '</manifest>\n<spine toc="ncx"><itemref idref="body"/></spine>\n</package>\n';

    var ncx = '<?xml version="1.0" encoding="utf-8"?>\n' +
      '<ncx xmlns="http://www.daisy.org/z3986/2005/ncx/" version="2005-1">\n' +
      '<head><meta name="dtb:uid" content="' + id + '"/><meta name="dtb:depth" content="1"/>' +
      '<meta name="dtb:totalPageCount" content="0"/><meta name="dtb:maxPageNumber" content="0"/></head>\n' +
      '<docTitle><text>' + esc2(title) + '</text></docTitle>\n' +
      '<navMap><navPoint id="np1" playOrder="1"><navLabel><text>正文</text></navLabel>' +
      '<content src="text.xhtml"/></navPoint></navMap>\n</ncx>\n';

    var container = '<?xml version="1.0" encoding="utf-8"?>\n' +
      '<container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container">\n' +
      '<rootfiles><rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/></rootfiles>\n' +
      '</container>\n';

    var css = 'body{font-family:serif;line-height:1.8;margin:0 1em}h1{font-size:1.3em;margin:1em 0}' +
      'p{margin:0 0 .8em}p.blank{height:.8em}';

    return zipStore([
      { name: 'mimetype', bytes: enc.encode('application/epub+zip') },
      { name: 'META-INF/container.xml', bytes: enc.encode(container) },
      { name: 'OEBPS/content.opf', bytes: enc.encode(opf) },
      { name: 'OEBPS/toc.ncx', bytes: enc.encode(ncx) },
      { name: 'OEBPS/text.xhtml', bytes: enc.encode(xhtml) },
      { name: 'OEBPS/style.css', bytes: enc.encode(css) }
    ]);
  }

  function buildOutput(text, fmt, opt, title) {
    var paras = textToParagraphs(text, opt);
    switch (fmt) {
      case 'docx': return buildDocx(text, opt);
      case 'epub': return buildEpub(title, paras);
      case 'html': return new Blob([buildHtml(title, paras)], { type: 'text/html;charset=utf-8' });
      case 'md': return new Blob([paras.join('\n\n') + '\n'], { type: 'text/markdown;charset=utf-8' });
      case 'rtf': return new Blob([buildRtf(paras)], { type: 'application/rtf' });
      case 'json': return new Blob([buildJson(paras, text, title)], { type: 'application/json;charset=utf-8' });
      case 'csv': return new Blob(['\ufeff' + buildCsv(text)], { type: 'text/csv;charset=utf-8' });
      default: return new Blob([text.replace(/\r\n?/g, '\n')], { type: 'text/plain;charset=utf-8' });
    }
  }

  /* ================= 转换面板 ================= */

  var cState = { file: null, isDocx: false, docxBuffer: null, docxText: null };
  var cText = $('cText');

  function baseName() {
    if (cState.file) return cState.file.name.replace(/\.[^.]+$/, '') || '文档';
    return '文本';
  }

  function syncConvertUI() {
    var docxIn = cState.isDocx;
    cText.hidden = docxIn;
    $('cFileTip').hidden = !docxIn;
    var fmtSel = $('cTarget').value;
    $('cDocxOpts').hidden = docxIn || !PARA_FORMATS[fmtSel];
    $('cTxtOpts').hidden = !docxIn;
    $('cTarget').disabled = docxIn;
    if (docxIn) $('cTarget').value = 'txt';

    if (docxIn) {
      $('cEst').textContent = '将提取正文并导出为 .txt';
      return;
    }
    var t = cText.value;
    var lines = t === '' ? 0 : t.split('\n').length;
    var target = $('cTarget').value;
    if (t === '') $('cEst').textContent = '—';
    else if (target === 'docx') {
      var bytes = new TextEncoder().encode(t).length;
      $('cEst').textContent = t.length + ' 字 · ' + lines + ' 行 · 导出 .docx 约 ' + fmtSize(bytes + 1200);
    } else if (target === 'epub') {
      var bytes2 = new TextEncoder().encode(t).length;
      $('cEst').textContent = t.length + ' 字 · ' + lines + ' 行 · 导出 .epub 约 ' + fmtSize(bytes2 + 2600);
    } else {
      $('cEst').textContent = t.length + ' 字 · ' + lines + ' 行 · 导出 .' + target;
    }
  }

  function updateCount() {
    var t = cText.value;
    $('cCount').textContent = t ? t.length + ' 字' : '';
  }

  cText.addEventListener('input', function () { updateCount(); syncConvertUI(); });
  $('cTarget').addEventListener('change', syncConvertUI);

  // 互斥：每个换行成段 <-> 段落内软回车
  $('optLine').addEventListener('change', function () {
    if (this.checked) $('optSoft').checked = false;
    else if (!$('optSoft').checked) this.checked = true;
  });
  $('optSoft').addEventListener('change', function () {
    if (this.checked) $('optLine').checked = false;
    else if (!$('optLine').checked) this.checked = false;
  });

  function clearConvert() {
    cState = { file: null, isDocx: false, docxBuffer: null, docxText: null };
    cText.value = '';
    cText.hidden = false;
    $('cFileTip').hidden = true;
    $('cCount').textContent = '';
    syncConvertUI();
    setStatus('');
  }
  $('cClear').addEventListener('click', clearConvert);
  $('cFileRemove').addEventListener('click', clearConvert);

  function loadDocxFile(file) {
    return file.arrayBuffer().then(function (ab) {
      cState.file = file;
      cState.isDocx = true;
      cState.docxBuffer = ab;
      $('cFileName').textContent = file.name;
      $('cFileSize').textContent = fmtSize(file.size);
      $('cCount').textContent = '';
      syncConvertUI();
    });
  }

  $('cFile').addEventListener('change', function () {
    var f = this.files && this.files[0];
    this.value = '';
    if (!f) return;
    if (isDocx(f)) {
      setStatus('正在读取 docx…');
      loadDocxFile(f).then(function () { setStatus(''); })
        .catch(function (e) { setStatus('读取失败：' + esc(e.message || e), 'err'); });
    } else {
      readTextFile(f).then(function (text) {
        cState.file = f;
        cState.isDocx = false;
        cText.value = text;
        updateCount(); syncConvertUI(); setStatus('');
      }).catch(function (e) { setStatus('读取失败：' + esc(e.message || e), 'err'); });
    }
  });

  function handleDrop(e, onFile) {
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (!f) return;
    onFile(f);
  }

  [cText].forEach(function (el) {
    el.addEventListener('dragover', function (e) { e.preventDefault(); el.style.borderColor = 'var(--accent)'; });
    el.addEventListener('dragleave', function () { el.style.borderColor = ''; });
    el.addEventListener('drop', function (e) {
      e.preventDefault(); el.style.borderColor = '';
      handleDrop(e, function (f) {
        if (isDocx(f)) loadDocxFile(f).then(syncConvertUI).catch(function (er) { setStatus('读取失败：' + esc(er.message || er), 'err'); });
        else readTextFile(f).then(function (t) { cState.file = f; cState.isDocx = false; cText.value = t; updateCount(); syncConvertUI(); })
          .catch(function (er) { setStatus('读取失败：' + esc(er.message || er), 'err'); });
      });
    });
  });

  $('cGo').addEventListener('click', function () {
    if (cState.isDocx) {
      setStatus('正在提取文字…');
      docxToText(cState.docxBuffer).then(function (text) {
        if (!text.trim()) throw new Error('文档里没有可提取的文字');
        var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        download(blob, baseName() + '.txt');
        setStatus('完成 · ' + esc(baseName() + '.txt') + ' · ' + text.length + ' 字 · ' + fmtSize(blob.size), 'ok');
      }).catch(function (e) { setStatus('转换失败：' + esc(e.message || e), 'err'); });
      return;
    }

    var text = cText.value;
    if (!text) { setStatus('先粘贴文本或选一个文件。', 'err'); return; }

    var fmt = $('cTarget').value;
    try {
      var blob = buildOutput(text, fmt, {
        soft: $('optSoft').checked,
        trim: $('optTrim').checked,
        merge: $('optMerge').checked
      }, baseName());
      var fname = baseName() + '.' + EXT[fmt];
      download(blob, fname);
      setStatus('完成 · ' + esc(fname) + ' · ' + fmtSize(blob.size), 'ok');
    } catch (e) {
      setStatus('生成失败：' + esc(e.message || e), 'err');
    }
  });

  /* ================= 分割面板 ================= */

  var sText = $('sText');
  var sMode = $('sMode');
  var sParam = $('sParam');

  function splitText(text, mode, param) {
    var parts = [];
    if (mode === 'parts') {
      var n = Math.max(1, Math.min(999, parseInt(param, 10) || 2));
      if (n === 1) return [text];
      var per = Math.ceil(text.length / n);
      var start = 0;
      for (var i = 0; i < n && start < text.length; i++) {
        var end = Math.min(text.length, start + per);
        if (i < n - 1 && end < text.length) {
          var nl = text.lastIndexOf('\n', end);
          if (nl > start + Math.floor(per * 0.4)) end = nl + 1;
        }
        parts.push(text.slice(start, end));
        start = end;
      }
    } else if (mode === 'lines') {
      var size = Math.max(1, parseInt(param, 10) || 100);
      var lines = text.split('\n');
      for (var j = 0; j < lines.length; j += size) parts.push(lines.slice(j, j + size).join('\n'));
    } else if (mode === 'chars') {
      var size2 = Math.max(1, parseInt(param, 10) || 2000);
      for (var k = 0; k < text.length; k += size2) parts.push(text.slice(k, k + size2));
    } else if (mode === 'sep') {
      if (!param) return [text];
      parts = text.split(param);
    }
    return parts.filter(function (p) { return p !== ''; });
  }

  function updateSplit() {
    var text = sText.value;
    var mode = sMode.value;
    var param = sParam.value;

    $('sCount').textContent = text ? text.length + ' 字' : '';

    if (mode === 'sep') {
      $('sParamLabel').textContent = '分隔符';
      sParam.setAttribute('inputmode', 'text');
    } else {
      $('sParamLabel').textContent = mode === 'parts' ? '份数' : (mode === 'lines' ? '每份行数' : '每份字数');
      sParam.setAttribute('inputmode', 'numeric');
    }

    if (!text) {
      $('sEst').textContent = '—';
      $('sList').innerHTML = '';
      $('sZip').disabled = true;
      return;
    }

    var parts = splitText(text, mode, param);
    if (!parts.length) {
      $('sEst').textContent = '切分结果为空，检查一下分隔符。';
      $('sList').innerHTML = '';
      $('sZip').disabled = true;
      return;
    }

    var avg = Math.round(text.length / parts.length);
    $('sEst').textContent = '将生成 ' + parts.length + ' 份 · 每份约 ' + avg + ' 字 · 合计 ' + text.length + ' 字';
    $('sZip').disabled = false;

    var shown = Math.min(parts.length, 300);
    var html = '';
    for (var i = 0; i < shown; i++) {
      html += '<div class="part"><span class="pn">' + esc(partName(i)) + '</span>' +
        '<span class="ps">' + parts[i].length + ' 字</span>' +
        '<button type="button" data-i="' + i + '">下载</button></div>';
    }
    if (parts.length > shown) html += '<div class="part"><span class="pn">…另有 ' + (parts.length - shown) + ' 份，请用上方打包下载</span></div>';
    $('sList').innerHTML = html;
    lastParts = parts;
  }

  var lastParts = [];

  function splitBase() {
    return cState.file ? cState.file.name.replace(/\.[^.]+$/, '') : '文本';
  }

  function partName(i) {
    var pad = lastParts.length > 99 ? 3 : 2;
    var n = String(i + 1);
    while (n.length < pad) n = '0' + n;
    return splitBase() + '-' + n + '.txt';
  }

  $('sList').addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('button[data-i]') : null;
    if (!btn) return;
    var i = parseInt(btn.getAttribute('data-i'), 10);
    var blob = new Blob([lastParts[i]], { type: 'text/plain;charset=utf-8' });
    download(blob, partName(i));
    setStatus('已下载 · ' + esc(partName(i)) + ' · ' + lastParts[i].length + ' 字', 'ok');
  });

  $('sZip').addEventListener('click', function () {
    if (!lastParts.length) return;
    try {
      var enc = new TextEncoder();
      var files = lastParts.map(function (p, i) {
        return { name: partName(i), bytes: enc.encode(p) };
      });
      var blob = zipStore(files);
      download(blob, splitBase() + '-分割.zip');
      setStatus('完成 · ' + esc(splitBase() + '-分割.zip') + ' · ' + lastParts.length + ' 份 · ' + fmtSize(blob.size), 'ok');
    } catch (e) {
      setStatus('打包失败：' + esc(e.message || e), 'err');
    }
  });

  $('sMode').addEventListener('change', function () {
    if (this.value === 'parts') sParam.value = '3';
    else if (this.value === 'lines') sParam.value = '100';
    else if (this.value === 'chars') sParam.value = '2000';
    else sParam.value = '\n\n';
    updateSplit();
  });
  sParam.addEventListener('input', updateSplit);
  sText.addEventListener('input', updateSplit);

  $('sClear').addEventListener('click', function () {
    sText.value = ''; $('sCount').textContent = ''; $('sList').innerHTML = ''; $('sEst').textContent = '—';
    $('sZip').disabled = true; setStatus('');
  });

  $('sFile').addEventListener('change', function () {
    var f = this.files && this.files[0];
    this.value = '';
    if (!f) return;
    if (isDocx(f)) { setStatus('分割只接受纯文本，先在上方「格式转换」里把 docx 转成 txt。', 'err'); return; }
    readTextFile(f).then(function (t) {
      cState.file = f;
      sText.value = t;
      updateSplit();
      setStatus('');
    }).catch(function (e) { setStatus('读取失败：' + esc(e.message || e), 'err'); });
  });

  sText.addEventListener('dragover', function (e) { e.preventDefault(); sText.style.borderColor = 'var(--accent)'; });
  sText.addEventListener('dragleave', function () { sText.style.borderColor = ''; });
  sText.addEventListener('drop', function (e) {
    e.preventDefault(); sText.style.borderColor = '';
    handleDrop(e, function (f) {
      if (isDocx(f)) { setStatus('分割只接受纯文本，先在上方「格式转换」里把 docx 转成 txt。', 'err'); return; }
      readTextFile(f).then(function (t) { cState.file = f; sText.value = t; updateSplit(); })
        .catch(function (er) { setStatus('读取失败：' + esc(er.message || er), 'err'); });
    });
  });

  /* ================= 开发者选项 ================= */

  $('devBtn').addEventListener('click', function () {
    var open = $('devPanel').hidden;
    $('devPanel').hidden = !open;
    $('devBtn').setAttribute('aria-expanded', String(open));
  });

  /* ================= 初始化 ================= */

  syncConvertUI();
  updateSplit();

  if (globalThis.__DSH_TEST__) {
    globalThis.__textTest = {
      buildDocx: buildDocx, textToParagraphs: textToParagraphs,
      docxToText: docxToText, extractDocxText: extractDocxText,
      zipStore: zipStore, unzipIndex: unzipIndex,
      splitText: splitText, buildOutput: buildOutput,
      buildHtml: buildHtml, buildRtf: buildRtf, buildJson: buildJson,
      buildCsv: buildCsv, buildEpub: buildEpub, EXT: EXT
    };
  }
})();

</script>
</body>
</html>

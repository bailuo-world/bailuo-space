<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f6f8">
<title>音频格式转换器</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --text:#15181e; --muted:#6b7280;
    --line:#e6e8ec; --accent:#2f6fed; --accent-ink:#fff; --soft:#eef3fe;
    --ok:#0f8b63; --err:#cf3b3b;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0e1014; --card:#171a21; --text:#e9ecf1; --muted:#98a0ad;
      --line:#272c36; --accent:#6a9bff; --accent-ink:#0a1224; --soft:#16213a;
      --ok:#3ccf9b; --err:#ff7070;
    }
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; padding:20px 16px 40px; background:var(--bg); color:var(--text);
    font:15.5px/1.55 -apple-system,BlinkMacSystemFont,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  }
  .wrap{max-width:620px; margin:0 auto}
  header{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:16px}
  h1{font-size:20px; line-height:1.3; margin:0 0 3px; letter-spacing:-.01em}
  .sub{margin:0; font-size:12.5px; color:var(--muted)}
  .hint-btn{
    flex:none; font:inherit; font-size:12.5px; color:var(--muted); background:var(--card);
    border:1px solid var(--line); border-radius:999px; padding:5px 11px; cursor:pointer;
    transition:.15s; white-space:nowrap;
  }
  .hint-btn:hover{color:var(--text); border-color:var(--muted)}
  .hint-btn[aria-expanded="true"]{background:var(--soft); border-color:transparent; color:var(--accent)}

  .hint-panel{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:13px 15px; margin-bottom:14px; font-size:13px; color:var(--muted);
  }
  .hint-panel p{margin:0 0 9px}
  .hint-panel p:last-child{margin:0}
  .hint-panel b{color:var(--text); font-weight:600}
  .fmt{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 10px; padding:0; list-style:none}
  .fmt li{
    font-size:12px; padding:2px 8px; border-radius:6px;
    background:var(--soft); color:var(--accent); font-variant-numeric:tabular-nums;
  }
  .fmt li.off{background:transparent; color:var(--muted); border:1px dashed var(--line); text-decoration:line-through}

  .drop{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    padding:34px 18px; background:var(--card); border:1.5px dashed var(--line); border-radius:16px;
    text-align:center; cursor:pointer; transition:border-color .15s, background .15s;
  }
  .drop:hover,.drop.over{border-color:var(--accent); background:var(--soft)}
  .drop-ico{font-size:26px; line-height:1; color:var(--accent)}
  .drop-main{margin:0; font-size:14.5px; font-weight:500}
  .drop-sub{margin:0; font-size:12px; color:var(--muted)}

  .panel{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px}
  .filebar{display:flex; align-items:center; gap:10px; margin-bottom:14px}
  .fname{flex:1; min-width:0; font-size:14px; font-weight:550; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .ghost{
    flex:none; font:inherit; font-size:12.5px; color:var(--muted); background:none; border:0;
    padding:2px; cursor:pointer; text-decoration:underline; text-underline-offset:3px;
  }
  .ghost:hover{color:var(--text)}

  .meta{display:grid; grid-template-columns:repeat(auto-fit,minmax(92px,1fr)); gap:10px 14px; margin:0 0 16px}
  .meta dt{font-size:11.5px; color:var(--muted)}
  .meta dd{margin:1px 0 0; font-size:13.5px; font-variant-numeric:tabular-nums}

  .opts{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:12px}
  .field{display:flex; flex-direction:column; gap:5px; font-size:12px; color:var(--muted)}
  select{
    font:inherit; font-size:13.5px; color:var(--text); background:var(--card);
    border:1px solid var(--line); border-radius:9px; padding:8px 9px; width:100%;
  }
  select:disabled{opacity:.6}
  .est{margin:0 0 14px; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}
  .primary{
    width:100%; font:inherit; font-size:14.5px; font-weight:600; color:var(--accent-ink);
    background:var(--accent); border:0; border-radius:10px; padding:12px; cursor:pointer;
  }
  .primary:disabled{opacity:.55; cursor:default}
  select:focus-visible,button:focus-visible,.drop:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  .status{margin:14px 0 0; font-size:12.5px; color:var(--muted); word-break:break-word}
  .status.ok{color:var(--ok)}
  .status.err{color:var(--err)}
  .status a{color:inherit}

  footer{margin-top:18px; text-align:center; font-size:11.5px; color:var(--muted)}
  .note{margin:0 0 8px}
  .dev-link{
    font:inherit; font-size:11.5px; color:var(--muted); background:none; border:0; padding:6px 8px;
    cursor:pointer; text-decoration:underline; text-underline-offset:3px; opacity:.8;
  }
  .dev-link:hover{opacity:1; color:var(--text)}
  .dev-panel{
    margin:10px auto 0; padding:16px 14px; max-width:320px;
    background:var(--card); border:1px solid var(--line); border-radius:14px;
  }
  .dev-author{margin:0 0 12px; font-size:13.5px; color:var(--text)}
  .dev-author b{font-weight:600}
  .dev-qr{display:block; width:100%; max-width:280px; height:auto; margin:0 auto 10px; border-radius:10px}
  .dev-tip{margin:0; font-size:11.5px; color:var(--muted)}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div>
      <h1>音频格式转换器</h1>
      <p class="sub">浏览器本地转换 · 不上传</p>
    </div>
    <button id="hintBtn" class="hint-btn" type="button" aria-expanded="false" aria-controls="hintPanel">支持的格式 ?</button>
  </header>

  <div id="hintPanel" class="hint-panel" hidden></div>

  <section id="drop" class="drop" role="button" tabindex="0" aria-label="选择音频文件">
    <span class="drop-ico" aria-hidden="true">♪</span>
    <p class="drop-main">拖入音频文件，或点击选择</p>
    <p class="drop-sub">一次处理一个文件 · 全程在本地完成</p>
  </section>
  <input id="file" type="file" accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg,.oga,.opus,.flac,.webm,.aiff,.aif" hidden>

  <section id="panel" class="panel" hidden>
    <div class="filebar">
      <span class="fname" id="fileName"></span>
      <button id="reset" class="ghost" type="button">换一个</button>
    </div>
    <dl class="meta" id="meta"></dl>
    <div class="opts">
      <label class="field"><span>格式</span>
        <select id="fmt">
          <option value="mp3">MP3</option>
          <option value="flac">FLAC（无损）</option>
          <option value="wav">WAV（无压缩）</option>
        </select>
      </label>
      <label class="field"><span>采样率</span><select id="rate"></select></label>
      <label class="field"><span>声道</span>
        <select id="ch">
          <option value="same">保持原样</option>
          <option value="mono">单声道</option>
          <option value="stereo">立体声</option>
        </select>
      </label>
      <label class="field"><span id="labelA">码率</span><select id="optA"></select></label>
      <label class="field" id="wrapB"><span>压缩级别</span><select id="optB"></select></label>
    </div>
    <p class="est" id="est"></p>
    <button id="go" class="primary" type="button">导出</button>
  </section>

  <p class="status" id="status" role="status" aria-live="polite" hidden></p>
  <footer>
    <p class="note">音频只在本机处理，不会上传到任何服务器</p>
    <button id="devBtn" class="dev-link" type="button" aria-expanded="false" aria-controls="devPanel">开发者选项</button>
    <div id="devPanel" class="dev-panel" hidden>
      <p class="dev-author">作者：<b>白洛bailuo</b></p>

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function fmtSize(n) {
    if (!isFinite(n)) return '—';
    var u = ['B', 'KB', 'MB', 'GB'], i = 0;
    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
    return (i === 0 ? String(n) : n.toFixed(n < 10 ? 2 : 1)) + ' ' + u[i];
  }

  function fmtTime(sec) {
    sec = Math.round(sec);
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ':' + (s < 10 ? '0' + s : s);
  }

  function fmtRate(r) {
    return (r / 1000).toFixed(3).replace(/0+$/, '').replace(/\.$/, '') + ' kHz';

  var flacPromise = null;

  function b64ToBytes(b64) {
    var bin = atob(b64), n = bin.length, out = new Uint8Array(n);
    for (var i = 0; i < n; i++) out[i] = bin.charCodeAt(i);

  function initFlac() {

    flacPromise = Promise.resolve().then(function () {

      return new Promise(function (res, rej) {

    ['WAV', 'audio/wav'],
    ['M4A / AAC', 'audio/mp4; codecs="mp4a.40.2"'],
    ['AAC', 'audio/aac'],
    ['OGG Vorbis', 'audio/ogg; codecs="vorbis"'],
    ['FLAC', 'audio/flac'],
    ['WebM Opus', 'audio/webm; codecs="opus"'],
    ['AIFF', 'audio/aiff']
  ];

  function renderHint() {
    var probe = document.createElement('audio');
    var items = INPUT_FORMATS.map(function (f) {
      var can = probe.canPlayType(f[1]);
      var ok = !!can && can !== 'no';
      return '<li class="' + (ok ? '' : 'off') + '">' + (ok ? '✓ ' : '— ') + esc(f[0]) + '</li>';
    }).join('');
    hintPanel.innerHTML =
      '<p><b>能导入什么</b>取决于浏览器自带的解码器，当前这台设备支持：</p>' +
      '<ul class="fmt">' + items + '</ul>' +
      '<p>划掉的格式换个浏览器可能就能用；列表之外的也可以直接拖进来试，失败会提示。</p>' +
      '<p><b>能导出</b>：MP3（有损，体积小）、FLAC（无损压缩）、WAV（无压缩）。三个编码器都内置于本文件，不需要联网。</p>';
  }

  hintBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    var open = hintPanel.hidden;
    if (open) renderHint();
    hintPanel.hidden = !open;
    hintBtn.setAttribute('aria-expanded', String(open));
  });

  document.addEventListener('click', function (e) {
    if (!hintPanel.hidden && !hintPanel.contains(e.target) && e.target !== hintBtn) {
      hintPanel.hidden = true;
      hintBtn.setAttribute('aria-expanded', 'false');
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !hintPanel.hidden) {
      hintPanel.hidden = true;
      hintBtn.setAttribute('aria-expanded', 'false');
    }
  });

  /* ---------------- 选文件 ---------------- */

  dropEl.addEventListener('click', function () { fileEl.click(); });
  dropEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileEl.click(); }
  });
  fileEl.addEventListener('change', function () {
    var f = fileEl.files && fileEl.files[0];
    fileEl.value = '';
    if (f) handleFile(f);
  });

  ['dragenter', 'dragover'].forEach(function (t) {
    document.addEventListener(t, function (e) {
      if (e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') > -1) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'copy';
        dropEl.classList.add('over');
      }
    });
  });
  document.addEventListener('dragleave', function (e) {
    if (!e.relatedTarget) dropEl.classList.remove('over');
  });
  document.addEventListener('drop', function (e) {
    e.preventDefault();
    dropEl.classList.remove('over');
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) handleFile(f);
  });

  /* ---------------- 解码 ---------------- */

  function handleFile(file) {
    if (busy) return;

    var looksAudio = /^audio\//.test(file.type) ||
      /\.(mp3|wav|wave|m4a|mp4|aac|ogg|oga|opus|flac|webm|aiff?|caf)$/i.test(file.name);
    if (!looksAudio) {
      setStatus('这看起来不是音频文件（' + esc(file.type || '未知类型') + '），换一个试试。', 'err');
      return;
    }

    currentFile = file;
    nameEl.textContent = file.name;
    goEl.disabled = true;
    panelEl.hidden = false;
    dropEl.hidden = true;
    setStatus('正在解码…');

    var Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) { setStatus('这个浏览器不支持 Web Audio，无法转换。', 'err'); return; }

    file.arrayBuffer().then(function (raw) {
      var ac = new Ctx();
      return ac.decodeAudioData(raw).then(function (buf) {
        if (ac.close) ac.close();
        return buf;
      }, function (err) {
        if (ac.close) ac.close();
        throw err;
      });
    }).then(function (buf) {
      if (!buf || !buf.length) throw new Error('音频内容为空');
      decoded = buf;
      buildMeta(file, buf);
      buildOptions(buf);
      goEl.disabled = false;
      setStatus('');
    }).catch(function () {
      decoded = null;
      panelEl.hidden = true;
      dropEl.hidden = false;
      setStatus('解码失败：浏览器可能不支持这个格式，或文件已损坏。点右上角「支持的格式」看看当前浏览器能读什么。', 'err');
    });
  }

  function buildMeta(file, buf) {
    var ext = (file.name.split('.').pop() || '').toUpperCase();
    var rows = [
      ['时长', fmtTime(buf.duration)],
      ['原始格式', ext || '未知'],
      ['原始采样率', fmtRate(buf.sampleRate)],
      ['原始声道', chLabel(buf.numberOfChannels)],
      ['文件大小', fmtSize(file.size)]
    ];
    metaEl.innerHTML = rows.map(function (r) {
      return '<div><dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd></div>';
    }).join('');
  }

  function buildOptions(buf) {
    var rates = [48000, 44100, 22050, 16000].filter(function (r) { return r !== buf.sampleRate; });
    rateEl.innerHTML = '<option value="same">原样（' + esc(fmtRate(buf.sampleRate)) + '）</option>' +
      rates.map(function (r) { return '<option value="' + r + '">' + esc(fmtRate(r)) + '</option>'; }).join('');
    chEl.value = 'same';
    syncFormat();
  }

  /* ---------------- 格式联动 ---------------- */

  function optionsHtml(list) {
    return list.map(function (o) {
      return '<option value="' + o[0] + '">' + esc(o[1]) + '</option>';
    }).join('');
  }

  function syncFormat() {
    var f = fmtEl.value;
    if (f === 'mp3') {
      labelA.textContent = '码率';
      optAEl.innerHTML = optionsHtml([['128', '128 kbps（小）'], ['192', '192 kbps（推荐）'], ['320', '320 kbps（高）']]);
      optAEl.value = '192';
      wrapB.hidden = true;
    } else if (f === 'flac') {
      labelA.textContent = '位深';
      optAEl.innerHTML = optionsHtml([['16', '16 位'], ['24', '24 位']]);
      optAEl.value = '16';
      wrapB.hidden = false;
      optBEl.innerHTML = optionsHtml([['0', '0（最快）'], ['5', '5（推荐）'], ['8', '8（最小）']]);
      optBEl.value = '5';
    } else {
      labelA.textContent = '位深';
      optAEl.innerHTML = optionsHtml([['16', '16 位'], ['24', '24 位'], ['32', '32 位浮点']]);
      optAEl.value = '16';
      wrapB.hidden = true;
    }
    goEl.textContent = '导出 ' + f.toUpperCase();
    updateEstimate();
  }

  fmtEl.addEventListener('change', syncFormat);
  [rateEl, chEl, optAEl, optBEl].forEach(function (s) { s.addEventListener('change', updateEstimate); });

  /* ---------------- 参数 ---------------- */

  function targetRate() {
    if (!decoded) return 44100;
    return rateEl.value === 'same' ? decoded.sampleRate : parseInt(rateEl.value, 10);
  }

  function targetChannels() {
    if (!decoded) return 2;
    var ch = chEl.value === 'mono' ? 1 : chEl.value === 'stereo' ? 2 : decoded.numberOfChannels;
    if (fmtEl.value === 'mp3' && ch > 2) ch = 2;
    return ch;
  }

  function updateEstimate() {
    if (!decoded) { estEl.textContent = ''; return; }
    var f = fmtEl.value;
    var rate = targetRate(), ch = targetChannels(), dur = decoded.duration;
    var frames = Math.ceil(dur * rate);
    var size, label;

    if (f === 'mp3') {
      var kbps = parseInt(optAEl.value, 10);
      size = kbps * 125 * dur;
      label = kbps + ' kbps';
    } else if (f === 'flac') {
      var bits = parseInt(optAEl.value, 10);
      size = frames * ch * (bits / 8) * 0.6;
      label = bits + ' 位 · 压缩 ' + optBEl.value;
    } else {
      var b = parseInt(optAEl.value, 10);
      size = 44 + frames * ch * (b === 32 ? 4 : b / 8);
      label = b + ' 位';
    }

    var approx = (f === 'flac') ? '≈ ' : '';
    estEl.textContent = '预计导出 ' + approx + fmtSize(size) + ' · ' + label + ' / ' +
      fmtRate(rate) + ' / ' + chLabel(ch);
  }

  /* ---------------- 重采样 ---------------- */

  function resample(buffer, rate, ch) {
    var frames = Math.max(1, Math.ceil(buffer.duration * rate));
    var Off = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    if (!Off) return Promise.reject(new Error('浏览器不支持离线渲染'));
    var off = new Off(ch, frames, rate);
    var src = off.createBufferSource();
    src.buffer = buffer;
    src.connect(off.destination);
    src.start();
    return off.startRendering();
  }

  /* ---------------- WAV 编码 ---------------- */

  function encodeWav(buffer, bits) {
    var ch = buffer.numberOfChannels, frames = buffer.length, sr = buffer.sampleRate;
    var bps = bits === 32 ? 4 : bits / 8;
    var blockAlign = ch * bps, dataSize = frames * blockAlign;
    var ab = new ArrayBuffer(44 + dataSize), v = new DataView(ab);

    function str(off, s) { for (var i = 0; i < s.length; i++) v.setUint8(off + i, s.charCodeAt(i)); }

    str(0, 'RIFF'); v.setUint32(4, 36 + dataSize, true);
    str(8, 'WAVE'); str(12, 'fmt ');
    v.setUint32(16, 16, true);
    v.setUint16(20, bits === 32 ? 3 : 1, true);
    v.setUint16(22, ch, true);
    v.setUint32(24, sr, true);
    v.setUint32(28, sr * blockAlign, true);
    v.setUint16(32, blockAlign, true);
    v.setUint16(34, bits, true);
    str(36, 'data'); v.setUint32(40, dataSize, true);

    var src = [];
    for (var c = 0; c < ch; c++) src.push(buffer.getChannelData(c));

    var o = 44, i, s, n;
    if (bits === 16) {
      for (i = 0; i < frames; i++) for (c = 0; c < ch; c++) {
        s = src[c][i]; s = s < -1 ? -1 : s > 1 ? 1 : s;
        v.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7FFF, true); o += 2;
      }
    } else if (bits === 24) {
      for (i = 0; i < frames; i++) for (c = 0; c < ch; c++) {
        s = src[c][i]; s = s < -1 ? -1 : s > 1 ? 1 : s;
        n = Math.round(s < 0 ? s * 0x800000 : s * 0x7FFFFF);
        v.setUint8(o, n & 0xff); v.setUint8(o + 1, (n >> 8) & 0xff); v.setUint8(o + 2, (n >> 16) & 0xff);
        o += 3;
      }
    } else {
      for (i = 0; i < frames; i++) for (c = 0; c < ch; c++) { v.setFloat32(o, src[c][i], true); o += 4; }
    }

    return new Blob([ab], { type: 'audio/wav' });
  }

  /* ---------------- MP3 编码 ---------------- */

  function encodeMp3(buffer, kbps, progress) {
    var ch = buffer.numberOfChannels, sr = buffer.sampleRate, n = buffer.length;
    var enc = new lamejs.Mp3Encoder(ch, sr, kbps);
    var chans = [];
    for (var c = 0; c < ch; c++) chans.push(buffer.getChannelData(c));

    var parts = [], BS = 1152, i = 0, blocks = 0;

    return new Promise(function (resolve, reject) {
      (function step() {
        var t0 = Date.now();
        try {
          while (i < n) {
            var end = Math.min(i + BS, n), len = end - i;
            var l = new Int16Array(len), r = ch > 1 ? new Int16Array(len) : null;
            var L = chans[0], R = ch > 1 ? chans[1] : null;
            for (var k = 0; k < len; k++) {
              var s = L[i + k]; s = s < -1 ? -1 : s > 1 ? 1 : s;
              l[k] = s < 0 ? s * 0x8000 : s * 0x7FFF;
              if (r) {
                var s2 = R[i + k]; s2 = s2 < -1 ? -1 : s2 > 1 ? 1 : s2;
                r[k] = s2 < 0 ? s2 * 0x8000 : s2 * 0x7FFF;
              }
            }
            var b = r ? enc.encodeBuffer(l, r) : enc.encodeBuffer(l);
            if (b.length) parts.push(new Uint8Array(b));
            i = end;
            if (++blocks % 64 === 0) {
              if (progress) progress(i / n);
              if (Date.now() - t0 > 40) break;
            }
          }
          if (i < n) { setTimeout(step, 0); return; }
          var tail = enc.flush();
          if (tail.length) parts.push(new Uint8Array(tail));
          resolve(new Blob(parts, { type: 'audio/mpeg' }));
        } catch (err) { reject(err); }
      })();
    });
  }

  /* ---------------- FLAC 编码 ---------------- */

  function encodeFlac(buffer, bits, compression, progress) {
    return initFlac().then(function (F) {
      var sr = buffer.sampleRate, ch = buffer.numberOfChannels, n = buffer.length;
      var enc = F.create_libflac_encoder(sr, ch, bits, compression, n, false, 0);
      if (!enc) throw new Error('FLAC 编码器创建失败');

      var parts = [];
      var st = F.init_encoder_stream(enc, function (data) {
        parts.push(new Uint8Array(data));
      }, null);
      if (st !== 0) throw new Error('FLAC 初始化失败（状态 ' + st + '）');

      var scale = bits === 24 ? 0x7FFFFF : 0x7FFF;
      var chans = [];
      for (var c = 0; c < ch; c++) chans.push(buffer.getChannelData(c));

      var BS = 4096, i = 0;

      return new Promise(function (resolve, reject) {
        var done = false;
        (function step() {
          if (done) return;
          var t0 = Date.now();
          try {
            while (i < n) {
              var len = Math.min(BS, n - i);
              var pcm = new Int32Array(len * ch);
              for (var k = 0; k < len; k++) {
                for (var c2 = 0; c2 < ch; c2++) {
                  var s = chans[c2][i + k];
                  s = s < -1 ? -1 : s > 1 ? 1 : s;
                  pcm[k * ch + c2] = (s * scale) | 0;
                }
              }
              if (!F.FLAC__stream_encoder_process_interleaved(enc, pcm, len)) {
                throw new Error('FLAC 编码中断');
              }
              i += len;
              if (Date.now() - t0 > 40) break;
            }
            if (i < n) { if (progress) progress(i / n); setTimeout(step, 0); return; }
            done = true;
            if (!F.FLAC__stream_encoder_finish(enc)) throw new Error('FLAC 收尾失败');
            resolve(new Blob(parts, { type: 'audio/flac' }));
          } catch (err) { done = true; reject(err); }
        })();
      });
    });
  }

  /* ---------------- 导出 ---------------- */

  function download(blob, name) {
    if (lastUrl) { URL.revokeObjectURL(lastUrl); lastUrl = null; }
    var url = URL.createObjectURL(blob);
    lastUrl = url;
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    return { url: url, name: name };
  }

  function exportAudio() {
    if (!decoded || busy) return;

    var fmt = fmtEl.value;
    var rate = targetRate(), ch = targetChannels();
    var bits = parseInt(optAEl.value, 10);
    var comp = fmt === 'flac' ? parseInt(optBEl.value, 10) : 0;

    busy = true;
    goEl.disabled = true;
    setStatus('准备中…');

    var t0 = Date.now();

    Promise.resolve().then(function () {
      if (rate === decoded.sampleRate && ch === decoded.numberOfChannels) return decoded;
      setStatus('重采样中…');
      return yieldNow().then(function () { return resample(decoded, rate, ch); });
    }).then(function (buf) {
      if (fmt === 'mp3') {
        setStatus('编码 MP3…');
        return encodeMp3(buf, bits, function (p) { setStatus('编码 MP3… ' + Math.round(p * 100) + '%'); });
      }
      if (fmt === 'flac') {
        setStatus('编码 FLAC…');
        return encodeFlac(buf, bits, comp, function (p) { setStatus('编码 FLAC… ' + Math.round(p * 100) + '%'); });
      }
      setStatus('编码 WAV…');
      return yieldNow().then(function () { return encodeWav(buf, bits); });
    }).then(function (blob) {
      var base = currentFile ? currentFile.name.replace(/\.[^.]+$/, '') : 'audio';
      var name = (base || 'audio') + '.' + fmt;
      var d = download(blob, name);
      var secs = ((Date.now() - t0) / 1000).toFixed(1);
      setStatus('完成 · ' + esc(name) + ' · ' + fmtSize(blob.size) + ' · 用时 ' + secs + 's' +
        ' — 如果没自动下载，<a href="' + d.url + '" download="' + esc(name) + '">点这里保存</a>', 'ok');
    }).catch(function (err) {
      setStatus('转换失败：' + esc((err && err.message) || String(err)), 'err');
    }).then(function () {
      busy = false;
      goEl.disabled = false;
    });
  }

  goEl.addEventListener('click', exportAudio);

  devBtn.addEventListener('click', function () {
    var open = devPanel.hidden;
    if (open) devPanel.hidden = false;
    else devPanel.hidden = true;
    devBtn.setAttribute('aria-expanded', String(open));
  });


  el('reset').addEventListener('click', function () {
    if (busy) return;
    decoded = null;
    currentFile = null;
    if (lastUrl) { URL.revokeObjectURL(lastUrl); lastUrl = null; }
    panelEl.hidden = true;
    dropEl.hidden = false;
    metaEl.innerHTML = '';
    estEl.textContent = '';
    setStatus('');
  });

  /* ---------------- 启动 ---------------- */

  if (globalThis.__DSH_TEST__) {
    globalThis.__convertTest = { wav: encodeWav, mp3: encodeMp3, flac: encodeFlac, init: initFlac };
  }

  syncFormat();

  setTimeout(function () {
    var opt = fmtEl.querySelector('option[value="flac"]');
    if (opt) opt.textContent = 'FLAC（加载中…）';
    initFlac().then(function () {
      if (opt) opt.textContent = 'FLAC（无损）';
    }).catch(function () {
      markFlacUnavailable();
    });
  }, 0);
})();

</script>
</body>
</html>
